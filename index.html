<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>احكي لي حكاية | قصص أطفال</title>

    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #f7f1e7;
            font-family: Arial, sans-serif;
            color: #4b4037;
            text-align: center;
        }

        .card {
            width: 90%;
            max-width: 520px;
            background: #fffdf9;
            padding: 45px 25px;
            border-radius: 24px;
            box-shadow: 0 8px 30px rgba(80, 60, 40, 0.12);
        }

        .moon {
            font-size: 55px;
            margin-bottom: 10px;
        }

        h1 {
            font-size: 32px;
            margin: 10px 0;
        }

        h2 {
            font-size: 20px;
            font-weight: normal;
            margin: 10px 0 25px;
        }

        p {
            font-size: 17px;
            line-height: 1.9;
            margin-bottom: 28px;
        }

        .button-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
            align-items: center;
        }

        .button {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 80%;
            max-width: 320px;
            padding: 12px 20px;
            color: white;
            text-decoration: none;
            border-radius: 14px;
            font-size: 18px;
            font-weight: bold;
            box-sizing: border-box;
            transition: opacity 0.2s;
        }

        .button-google {
            background: #6d8b74;
        }

        .button-amazon {
            background: #d89254;
        }

        .button:hover {
            opacity: 0.9;
        }

        .store-icon {
            width: 24px;
            height: 24px;
            fill: currentColor;
        }

        .small {
            margin-top: 30px;
            font-size: 13px;
            color: #8b8178;
        }
    </style>
</head>

<body>

    <div class="card">

        <div class="moon">🌙</div>

        <h1>احكي لي حكاية</h1>

        <h2>قصص أطفال مصوّرة</h2>

        <p>
            حكايات جميلة للأطفال، برسوم مائية هادئة
            وحكايات تُروى بصوت دافئ قبل النوم.
        </p>

        <div class="button-container">
            <a
                class="button button-google"
                href="https://google.com">
                <!-- Google Play SVG Icon -->
                <svg class="store-icon" viewBox="0 0 24 24">
                    <path d="M5,3.23V20.77C5,21.11 5.24,21.36 5.57,21.39L14.86,12.1L5.57,2.81C5.24,2.84 5,3.09 5,3.23M15.9,11.06L18.78,9.39C19.61,8.91 19.61,7.91 18.78,7.43L15.9,5.76L13.03,8.63L15.9,11.06M3,1.6C3,1.21 3.32,1 3.72,1C4,1 4.25,1.12 4.44,1.26L14.67,7.18L11.77,10.08L3,1.6M3,22.4L11.77,13.63L14.67,16.53L4.44,22.45C4.25,22.59 4,22.71 3.72,22.71C3.32,22.71 3,22.5 3,22.4Z"/>
                </svg>
                <span>أجهزة الأندرويد (Google Play)</span>
            </a>

            <a
                class="button button-amazon"
                href="https://amazon.com">
                <!-- Amazon SVG Icon -->
                <svg class="store-icon" viewBox="0 0 24 24">
                    <path d="M16.9,14.6C15.4,15.6 13,16.1 11.2,16.1C8.7,16.1 6.8,15 6.8,12.5C6.8,10 9,9.1 11.6,9.1C12.8,9.1 13.9,9.3 14.8,9.7V9C14.8,7.3 13.6,6.3 11.7,6.3C10.2,6.3 8.7,7.1 8.2,7.9C7.9,8.4 7.3,8.5 6.8,8.2L5.2,7C4.8,6.7 4.7,6.1 5.1,5.6C6.1,4.2 8.5,3.1 11.9,3.1C15.9,3.1 18.2,5.2 18.2,9.3V15.7C18.2,16.9 18.7,17.4 19.1,17.7C19.5,18 19.5,18.6 19,19C17.9,19.9 16.2,21 14.2,21C11.9,21 10.9,19.9 10.9,18.8C10.9,17.6 12,16.6 13.7,16.6C15.1,16.6 16.3,17.2 16.9,17.6V14.6M14.8,11.5C14.1,11.1 13,10.9 12,10.9C10.3,10.9 8.9,11.4 8.9,12.7C8.9,13.8 10,14.3 11.4,14.3C13.2,14.3 14.4,13.3 14.8,12.5V11.5M21.2,21.7C18.5,23.7 14.7,24.6 11.1,24.6C6,24.6 1.7,21.8 0.2,17.6C-0.1,17.1 0.1,16.5 0.6,16.3L2.3,15.4C2.8,15.1 3.4,15.3 3.7,15.8C4.8,18.7 7.7,20.6 11.2,20.6C14,20.6 17.2,19.7 19.7,17.9C20.3,17.5 21,18 20.8,18.6C20.7,19.3 21.3,21.7 21.2,21.7Z"/>
                </svg>
                <span>أجهزة التابلت (Amazon Appstore)</span>
            </a>
        </div>

        <div class="small">
            حكاية جديدة... وربما عالم جديد بالكامل 🌿
        </div>

    </div>

</body>
</html>

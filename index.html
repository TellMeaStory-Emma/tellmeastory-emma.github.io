<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>احكي لي حكاية | قصص أطفال</title>

    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #f7f1e7;
            font-family: Arial, sans-serif;
            color: #4b4037;
            text-align: center;
        }

        .card {
            width: 90%;
            max-width: 520px;
            background: #fffdf9;
            padding: 45px 25px;
            border-radius: 24px;
            box-shadow: 0 8px 30px rgba(80, 60, 40, 0.12);
        }

        .moon {
            font-size: 55px;
            margin-bottom: 10px;
        }

        h1 {
            font-size: 32px;
            margin: 10px 0;
        }

        h2 {
            font-size: 20px;
            font-weight: normal;
            margin: 10px 0 25px;
        }

        p {
            font-size: 17px;
            line-height: 1.9;
            margin-bottom: 28px;
        }

        .button {
            display: inline-block;
            padding: 15px 30px;
            background: #6d8b74;
            color: white;
            text-decoration: none;
            border-radius: 14px;
            font-size: 18px;
            font-weight: bold;
        }

        .button:hover {
            opacity: 0.9;
        }

        .small {
            margin-top: 25px;
            font-size: 13px;
            color: #8b8178;
        }
    </style>
</head>

<body>

    <div class="card">

        <div class="moon">🌙</div>

        <h1>احكي لي حكاية</h1>

        <h2>قصص أطفال مصوّرة</h2>

        <p>
            حكايات جميلة للأطفال، برسوم مائية هادئة
            وحكايات تُروى بصوت دافئ قبل النوم.
        </p>

        <a
            class="button"
            href="https://play.google.com/store/apps/details?id=com.mycompany.tellmeastory">
            📖 اكتشف التطبيق
        </a>

        <div class="small">
            حكاية جديدة... وربما عالم جديد بالكامل 🌿
        </div>

    </div>

</body>
</html>
